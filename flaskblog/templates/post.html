{% extends "layout.html" %}
{% block content %}
    <article class="media content-section">
        <!-- <img class="rounded-circle article-img" src="{{ url_for('static',filename='profile_pics/' + post.author.image) }}" alt="{{ url_for('static', filename='profile_pics/default.jpg') }}"> -->
        <img src="{{ url_for('static', filename='profile_pics/default.jpg') }}" alt="Profile picture">
    <div class="media-body">
        <div class="article-metadata">
            <a class="mr-2" href="#">{{ post.author.uname }}</a>
            <small class="text-muted">{{ post.date.strftime('%d-%m-%Y') }}</small>
            {% if post.author == current_user %}
            <div class="post-actions">
                <a href="{{ url_for('posts.update_post', post_id=post.id) }}" class="btn btn-edit-post btn-sm">Edit Post</a>
                <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#deleteModal">Delete</button>
            </div>
            {% endif %}
        </div>
        <h2 class="article-title">{{ post.title }}</h2>
        <p class="article-content">{{ post.content }}</p>
    </div>
    </article>
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Delete Post</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this post?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <form action="{{ url_for('posts.delete_post', post_id=post.id) }}" method="post">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
    </div>
{% endblock content %}
